[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liquid-staking-basis-research"
version = "0.1.0"
description = "Reproducible research for ETH liquid-staking basis"
requires-python = ">=3.13,<3.14"
dependencies = ["httpx>=0.28,<1", "polars>=1,<2", "pyarrow>=18,<24"]

[project.scripts]
lsb-data = "liquid_staking_basis.cli:main"
lsb-experiment-state = "liquid_staking_basis.execution_state:main"
lsb-experiment-001 = "liquid_staking_basis.experiment_001:main"

[project.optional-dependencies]
dev = ["mypy", "pytest", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true

